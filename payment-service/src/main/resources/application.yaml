spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/digital_banking_db?createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#    properties:
#      hibernate:
#        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083


  # Razorpay Configuration
  razorpay:
    key-id: ${RAZ_KEY_ID}
    key-secret: ${RAZ_KEY_SECRET}
    webhook-secret: ${RAZ_WEBHOOK_SECRET}

  management:
    endpoints:
      web:
        exposure:
          include: health,info